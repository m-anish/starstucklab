# Starstuck Lab Site Configuration
# This file controls behavior for all CLI tools and site generation

site:
  # Core site structure
  root: .
  src: src
  public: public
  data: src/data

ai:
  # AI generation settings
  enabled: true
  provider: openai  # or 'together'
  default_model: gpt-5.1
  temperature: 0.7
  
  # Provider-specific settings (from environment)
  # OPENAI_API_KEY or TOGETHER_API_KEY + TOGETHER_BASE_URL

content:
  # Content generation settings
  max_variants: 20
  persona_file: src/data/persona_preamble.txt

  # NOTE: the live about/hero prompts are the lists in src/data/about.json and
  # src/data/hero.json (read by tools/commands/content.py). The block that used
  # to live here was an unread duplicate and was removed to avoid prompt/voice
  # drift. The canonical voice is src/data/persona_preamble.txt.

projects:
  # Project management settings
  allowed_categories:
    - Hardware
    - Software
    - Art
    - Science
    - Electronics      
    - Mechanical       
    - Weather          
    - Telescope        
    - Other            
  
  allowed_status:
    - ongoing
    - completed
    - experimental
    - abandoned
    - dormant
  
  default_tags:      # Add these
    - arduino
    - raspberry-pi
    - sensor
    - prototype
  
  # Image generation for projects
  image_generation:
    enabled: true
    prompt_template: src/data/project_image_prompt_template.txt

products:
  # Product catalog settings
  default_currency: INR
  default_status: available

  # Product images follow convention: public/assets/product-{slug}/product-{slug}-master.png
  # Image processing variants can be defined per-product or use images.shared_variants

  # NOTE: the live product prompts are in src/data/product_prompts.json (read by
  # tools/lib/ai.py, which injects the canonical persona_preamble.txt as the
  # system voice). The block that used to live here was an unread duplicate and
  # was removed to avoid prompt/voice drift.

images:
  # Image processing settings
  default_quality: 75
  default_format: webp

  generation:
    size: "1024x1024"
    model: gpt-image-1

  processing:
    auto_optimize: true
    max_width: 1920
    max_height: 1080

  # Image processing pipeline (moved from images.json)
  shared_variants:
    - id: "generated"
      type: "generate"
      width: 1433
      height: 896
      filename: "generated.webp"
      prompt_file: "prompt.txt"
      quality: 75
    - id: "master"
      type: "master"
      width: 1433
      height: 896
      filename: "master.webp"
      quality: 75
    - id: "desktop"
      type: "crop"
      width: 2688
      height: 1680
      aspect: "16:10"
      centered: true
      filename: "desktop.webp"
      quality: 75
    - id: "laptop"
      type: "crop"
      width: 1280
      height: 720
      aspect: "16:9"
      centered: true
      filename: "laptop.webp"
      quality: 75
    - id: "tablet"
      type: "crop"
      width: 840
      height: 1120
      aspect: "3:4"
      centered: true
      filename: "tablet.webp"
      quality: 75
    - id: "mobile"
      type: "crop"
      width: 756
      height: 1344
      aspect: "9:16"
      centered: true
      filename: "mobile.webp"
      quality: 75
    - id: "thumb"
      type: "resize"
      width: 420
      height: 236
      filename: "thumb.webp"
      quality: 75

  # Static site asset scenes (fixed scenes that always exist)
  static_scenes:
    hero:
      master: "public/assets/hero/hero-master.png"
      variants: "shared_variants"
    workshop:
      master: "public/assets/workshop/workshop-master.png"
      variants: "shared_variants"
    shop:
      master: "public/assets/shop/shop-master.png"
      variants: "shared_variants"

  # Product images are configured per-product in src/data/products/{slug}.json
  # Each product defines its own image processing needs under the "images" key
  # Convention: master images at public/assets/product-{slug}/product-{slug}-master.png
  # Products can use "shared_variants" or define custom processing variants

cli:
  # CLI behavior settings
  interactive: true           # Enable interactive prompts
  confirm_destructive: true   # Confirm before deleting
  suggest_next_steps: true    # Suggest follow-up actions
  emoji: true                 # Use emoji in output
  
  # Workflow preferences
  workflows:
    after_project_create:
      - suggest_image_generation
      - suggest_navigation_add
      - offer_editor
    
    after_content_regenerate:
      - suggest_image_process
      - suggest_index_rebuild

# Developer settings (optional)
dev:
  auto_reload: true
  verbose_logging: false
  debug_mode: false